spring:
  application:
    name: cricapp-backend
  profiles:
    default: dev
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${DB_USER:postgres.jkdahlkcgjyiqnodvbix}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}

app:
  upload-dir: ./uploads/team-logos
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
